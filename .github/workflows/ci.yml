name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # npm install, not npm ci: the Windows-made lockfile omits Linux-only optional deps (@emnapi/*).
      - run: npm install --no-audit --no-fund
      - run: npm run lint
      - run: npm test
